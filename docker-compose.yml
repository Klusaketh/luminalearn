version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: lumina_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lumina_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lumina_dev_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-luminalearn_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lumina_admin} -d ${POSTGRES_DB:-luminalearn_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lumina_redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
