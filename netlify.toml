# Netlify hosts the Next.js frontend only. The FastAPI backend and PostgreSQL run elsewhere
# (see render.yaml); the frontend's server forwards /api/v1 to BACKEND_URL.
#
# Set BACKEND_URL in Netlify (Site configuration -> Environment variables) to the backend's public
# URL, e.g. https://luminalearn-api.onrender.com, then redeploy: the value is read at build time
# as well as at runtime.
#
# Limitation: Netlify cannot forward WebSockets, so the live voice session (/api/v1/voice) does not
# work on a Netlify-hosted frontend. Text tutoring, quizzes and lessons are unaffected.

[build]
  base = "frontend"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"
