version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: lumina_postgres_dev
    restart: always
    environment:
      POSTGRES_USER: lumina_admin
      POSTGRES_PASSWORD: lumina_dev_password_2026
      POSTGRES_DB: luminalearn_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumina_admin -d luminalearn_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lumina_redis_dev
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: lumina_backend_dev
    restart: always
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: lumina_admin
      POSTGRES_PASSWORD: lumina_dev_password_2026
      POSTGRES_DB: luminalearn_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      USE_SQLITE: "false"
    ports:
      - "8001:8000"  # host 8001: 8000 is often taken by other tools (e.g. Splunk)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../backend:/srv/backend
      - ../ai:/srv/ai
      - ../ml:/srv/ml

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://backend:8000
    container_name: lumina_frontend_dev
    restart: always
    environment:
      NODE_ENV: development
      BACKEND_URL: http://backend:8000  # the browser only ever talks to the frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_dev_data:
  redis_dev_data:
