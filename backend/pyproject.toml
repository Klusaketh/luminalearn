[tool.poetry]
name = "luminalearn-backend"
version = "1.0.0"
description = "FastAPI Backend Microservices for LuminaLearn AI Platform"
authors = ["LuminaLearn AI Engineering Team <engineering@luminalearn.ai>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.28.0"}
pydantic = "^2.6.4"
pydantic-settings = "^2.2.1"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.28"}
asyncpg = "^0.29.0"
redis = "^5.0.3"
passlib = {extras = ["argon2", "bcrypt"], version = "^1.7.4"}
pyjwt = "^2.8.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
httpx = "^0.27.0"
structlog = "^24.1.0"
google-generativeai = "^0.4.1"
langchain = "^0.1.13"
langchain-google-genai = "^0.0.11"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
pytest-asyncio = "^0.23.6"
ruff = "^0.3.4"
mypy = "^1.9.0"
black = "^24.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app", "ai", "ml"]

# Editor type checking: resolve the monorepo's shared ai/ and ml/ packages
[tool.ty.environment]
extra-paths = [".."]
