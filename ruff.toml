# Ruff Python Linter Configuration for LuminaLearn AI
target-version = "py311"
line-length = 88

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "ASYNC", # flake8-async
    "S",   # flake8-bandit (security checks)
]

ignore = [
    "E501", # Line length handled by formatter
    "B008", # Do not perform function calls in argument defaults (FastAPI Depends syntax)
]

fixable = ["ALL"]
unfixable = []

[lint.isort]
known-first-party = ["app", "ai", "ml"]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
